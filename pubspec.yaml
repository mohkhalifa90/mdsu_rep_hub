name: mdsu_rep_hub
description: MDSU Rep Hub – time reports, agendas, follow-ups and channels for student representatives.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  intl: '>=0.19.0 <0.21.0'
  file_picker: '>=10.3.10 <11.0.0'   # v11+ removed FilePicker.platform
  url_launcher: ^6.3.0
  excel: ^4.0.6
  firebase_core: '>=3.6.0 <5.0.0'
  firebase_messaging: '>=15.1.0 <17.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
